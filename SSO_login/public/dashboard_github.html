<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .info-row {
      margin-bottom: 16px;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      margin-top: 4px;
      font-size: 16px;
    }

    .sso {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .sso img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="header">
    <h1>Dashboard</h1>
    <div class="profile">
      <span id="user-email-top">johndoe2255369@gmail.com</span>
      <img id="profile-pic" src="https://via.placeholder.com/100" alt="Profile">
    </div>
  </div>

  <!-- Main content -->
  <div class="container">
    <div class="info-row">
      <div class="label">Email</div>
      <div class="value" id="user-email">johndoe2255369@gmail.com</div>
    </div>

    <div class="info-row">
      <div class="label">Login Method</div>
      <div class="sso">
        <img id="sso-logo" src="" alt="SSO Logo">
        <span id="login-method">Logged in using Google SSO</span>
      </div>
    </div>
  </div>

  <script>
    // 🔁 Replace these values dynamically after login
    const user = {
      email: "johndoe2255369@gmail.com",
      loginMethod: "Github SSO",
      ssoLogo: "https://www.svgrepo.com/show/475654/github-color.svg",
      profilePic: "https://testingbot.com/free-online-tools/random-avatar/200?img=8"
    };

    document.getElementById("user-email").textContent = user.email;
    document.getElementById("user-email-top").textContent = user.email;
    document.getElementById("login-method").textContent =
      `Logged in using ${user.loginMethod}`;
    document.getElementById("sso-logo").src = user.ssoLogo;
    document.getElementById("profile-pic").src = user.profilePic;
  </script>

</body>
</html>
